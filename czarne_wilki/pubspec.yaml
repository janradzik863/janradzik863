name: czarne_wilki
description: "Czarne Wilki — prywatny asystent AI: lokalne modele GGUF, chmura, głosy, automatyzacja własnego urządzenia."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Stan i nawigacja
  provider: ^6.1.2

  # Trwałe dane na urządzeniu (SQLite)
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.0   # desktop: Linux/Windows przez FFI
  sqlite3_flutter_libs: ^0.5.18 # desktop: bundlowany silnik sqlite3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Sieć (chmura / pobieranie modeli)
  dio: ^5.4.3

  # Dialogi zapisu/odczytu plików (desktop: eksport/import kopii zapasowej)
  file_picker: ^8.1.2

  # Głos: biblioteka TTS + nasłuch ciągły STT
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0

  # Lokalne wnioskowanie LLM (llama.cpp przez FFI)
  llama_cpp_dart: ^0.2.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
