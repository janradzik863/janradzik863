name: czarne_wilki
description: "Czarne Wilki Prawdy — Wszyscy Won! Prywatny asystent AI: lokalne modele GGUF, chmura, głosy, automatyzacja, szyfrowany komunikator, radio społecznościowe."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Stan i nawigacja
  provider: ^6.1.2

  # Trwałe dane na urządzeniu (SQLite)
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.0
  sqlite3_flutter_libs: ^0.5.18
  path: ^1.9.0
  path_provider: ^2.1.3

  # Sieć (chmura / pobieranie modeli / WebRTC signaling)
  dio: ^5.4.3

  # Dialogi zapisu/odczytu plików (desktop: eksport/import kopii zapasowej)
  file_picker: ^8.1.2

  # Głos: biblioteka TTS + nasłuch ciągły STT
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0

  # Lokalne wnioskowanie LLM (llama.cpp przez FFI)
  llama_cpp_dart: ^0.2.2

  # Szyfrowanie E2E (Signal Protocol / NaCl)
  cryptography: ^2.7.0
  pointycastle: ^3.9.1

  # WebRTC do połączeń głosowych/wideo (komunikator + radio)
  flutter_webrtc: ^0.12.2

  # Powiadomienia lokalne (alerty i ogłoszenia)
  flutter_local_notifications: ^18.0.1

  # UUID do identyfikatorów sesji, wiadomości, użytkowników
  uuid: ^4.5.1

  # Intl do formatowania dat w planerze
  intl: ^0.19.0

  # Markdown rendering w asystencie kodowania
  flutter_markdown: ^0.7.4

  # Szyfrowanie AES dla komunikatora
  encrypt: ^5.0.3

  # Udostępnianie treści
  share_plus: ^10.1.3

  # URL launcher
  url_launcher: ^6.3.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
